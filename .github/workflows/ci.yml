name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - closed
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.KARG_DOCKERHUB_USERNAME }}
          password: ${{ secrets.KARG_DOCKERHUB_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: FORCE_COLOR=1
          progress: plain
          tags: |
            ${{ secrets.KARG_DOCKERHUB_USERNAME }}/frontend:latest
            ${{ secrets.KARG_DOCKERHUB_USERNAME }}/frontend:${{ github.sha }}
            ${{ secrets.KARG_DOCKERHUB_USERNAME }}/frontend:${{ github.ref_name }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.KARG_HOST }}
          username: github
          key: ${{ secrets.KARG_SSH_PRIVATE_KEY }}
          script: dev.karg.kyiv.ua
